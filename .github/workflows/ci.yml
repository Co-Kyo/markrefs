name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Package metadata guard
        run: |
          node -e '
            const p = require("./package.json");
            const bad = Object.entries(p.bin ?? {}).filter(([, v]) => v.startsWith("./"));
            if (bad.length) {
              console.error("bin 值不得以 ./ 开头（npm 发布归一化会判非法并删除）:", bad);
              process.exit(1);
            }
            if (!p.bin || Object.keys(p.bin).length === 0) {
              console.error("package.json 缺少 bin：CLI 将不可用");
              process.exit(1);
            }
            console.log("package metadata ok:", JSON.stringify(p.bin));
          '
